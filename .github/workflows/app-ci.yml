name: App CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "dbt/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/app-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "dbt/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to run dbt build against"
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  dbt-parse:
    runs-on: ubuntu-latest
    env:
      DBT_ENV: dev
      ATHENA_RESULTS_BUCKET: placeholder-results
      LAKEHOUSE_BUCKET: placeholder-lakehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Parse the dbt project (no AWS access needed)
        run: dbt parse --project-dir dbt --profiles-dir dbt

  dbt-build:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - python-tests
      - dbt-parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Work out bucket names from the AWS account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "DBT_ENV=${{ inputs.target }}" >> "$GITHUB_ENV"
          echo "ATHENA_RESULTS_BUCKET=zaki-lakehouse-dbt-${{ inputs.target }}-athena-results-${ACCOUNT}" >> "$GITHUB_ENV"
          echo "LAKEHOUSE_BUCKET=zaki-lakehouse-dbt-${{ inputs.target }}-lakehouse-${ACCOUNT}" >> "$GITHUB_ENV"
      - name: dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt
